name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q App tests
      - name: Synthetic AIS regression tests
        run: python -m unittest discover -s tests -v
      - name: Publication guard
        run: python scripts/check_publication.py

  opensky-import-smoke:
    name: Windows DPAPI import (synthetic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell source and deployment scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem App,scripts,tests -Include '*.ps1' -Recurse -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) { throw "PowerShell parse failure" }
          }
          Write-Host "PowerShell syntax PASS"
      - name: Verify OpenSky credential importer without live secrets
        shell: pwsh
        run: ./tests/test_import_opensky.ps1
