name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q App tests
      - name: Synthetic AIS regression tests
        run: python -m unittest discover -s tests -v
      - name: Publication guard
        run: python scripts/check_publication.py

  ais-runtime-smoke:
    name: Windows pinned AIS runtime (loopback only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test the same pinned dependencies as the local runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --python 3.12 --with-requirements App/requirements.txt python -m unittest discover -s tests -p 'test_runtime_dependency.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows runtime smoke test failed' }

  opensky-import-smoke:
    name: Windows DPAPI import (synthetic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse all PowerShell source and deployment scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem App,scripts,tests -Include '*.ps1' -Recurse -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) { throw "PowerShell parse failure" }
          }
          Write-Host "PowerShell syntax PASS"
      - name: Verify OpenSky credential importer without live secrets
        shell: pwsh
        run: ./tests/test_import_opensky.ps1
