version: 2
updates:
  # App/requirements.txt is consumed directly by App/run.ps1.
  - package-ecosystem: "pip"
    directory: "/App"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:25"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      runtime-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
