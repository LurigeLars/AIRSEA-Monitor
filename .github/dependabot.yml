version: 2
updates:
  # The AIS collector currently installs websockets dynamically with uv --with.
  # Do not add an unconsumed pip manifest: Dependabot would not update runtime.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
